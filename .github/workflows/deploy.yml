name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Workflow default: read-only. The Pages write and OIDC grants are given to the
# deploy job alone, so the build job -- which runs third-party npm packages, on
# PR branches as well as main -- never holds a token that can publish the site.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # html-validate 11 requires ^22.22.0 || >=24.8.0 and eslint 10
          # requires ^20.19.0 || ^22.13.0 || >=24; Node 24 is the active LTS
          # and satisfies every engine constraint in the tree.
          node-version: 24
          cache: npm

      # No package in the tree needs an install script (the only one, fsevents,
      # is macOS-only and never installed here), so refuse to run any: a
      # compromised dependency's postinstall is the usual supply-chain vector.
      - run: npm ci --ignore-scripts

      # --- Security checks ---
      - name: Dependency audit (high severity)
        run: npm run audit

      - name: ESLint linting
        run: npm run lint

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Eleventy site
        run: npm run build

      - name: Validate generated HTML
        run: npm run html-validate

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish the Pages artifact
      id-token: write   # OIDC token deploy-pages exchanges for that publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
